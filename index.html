<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wojtoteka</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #050505;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #ffffff;
    text-align: center;
  }
  .card {
    padding: 48px 56px;
    border-radius: 16px;
    background: linear-gradient(135deg, #134e4a 0%, #0f766e 100%);
  }
  h1 {
    margin: 0 0 8px;
    font-size: 28px;
  }
  .age {
    font-size: 64px;
    font-weight: 800;
    color: #2DD4BF;
    margin: 8px 0;
  }
  .sub {
    opacity: 0.8;
    font-size: 14px;
  }
  a {
    color: #2DD4BF;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="age" id="wiek">...</div>
  </div>

  <script>
    function policzWiek() {
      const teraz = new Date(
        new Date().toLocaleString('en-US', { timeZone: 'Europe/Warsaw' })
      );

      const urodziny = new Date(2011, 8, 5); // wrzesień = 8 (miesiące liczone od 0)

      let wiek = teraz.getFullYear() - urodziny.getFullYear();
      const jeszczeNieMialUrodzin =
        teraz.getMonth() < urodziny.getMonth() ||
        (teraz.getMonth() === urodziny.getMonth() && teraz.getDate() < urodziny.getDate());

      if (jeszczeNieMialUrodzin) wiek--;

      document.getElementById('wiek').textContent = wiek;
    }

    policzWiek();
  </script>
</body>
</html>
