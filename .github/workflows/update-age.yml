name: Update age badge

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-age:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute age and update README
        run: |
          BIRTH_YEAR=2011
          BIRTH_MONTH=9
          BIRTH_DAY=5

          CUR_YEAR=$(date +%Y)
          CUR_MONTHDAY=$(date +%m%d)
          BIRTH_MONTHDAY=$(printf "%02d%02d" "$BIRTH_MONTH" "$BIRTH_DAY")

          AGE=$((CUR_YEAR - BIRTH_YEAR))
          if [ "$CUR_MONTHDAY" -lt "$BIRTH_MONTHDAY" ]; then
            AGE=$((AGE - 1))
          fi

          sed -i -E "s/[0-9]+_LAT-f59e0b/${AGE}_LAT-f59e0b/" README.md

          echo "Computed age: $AGE"

      - name: Commit changes if needed
        run: |
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update age badge"
            git push
          else
            echo "No changes needed."
          fi
